
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#faf9f6">

  <title>MA WISHLIST | Noël 2026</title>

  <link rel="stylesheet" href="style.css">

  <script src="script.js" defer></script>
</head>

<body>

  <main class="page">

    <!-- EN-TÊTE DE NOËL -->
    <header class="hero">

      <div class="ribbon-horizontal"></div>
      <div class="ribbon-vertical"></div>
      <div class="bow">✱</div>

      <div class="heading">
        <span>MA</span>
        <strong>WISHLIST</strong>
        <em>Noël 2026</em>
      </div>

    </header>

    <!-- INTRODUCTION -->
    <section class="intro">
      <p>
        Un petit cadeau, une grande attention ♡
      </p>
      <p>
        Cliquez sur « Je l'offre » pour réserver
        un cadeau et éviter les doublons.
      </p>
    </section>

    <!-- ÉTAT DES RÉSERVATIONS -->
    <p id="status"
       class="status"
       role="status"
       aria-live="polite">
      Chargement des cadeaux...
    </p>

    <!-- LISTE DES 17 CADEAUX -->
    <section
      id="grid"
      class="grid"
      aria-label="Ma liste de cadeaux de Noël">

      <!-- Les cadeaux seront affichés ici
           automatiquement par script.js -->

    </section>

    <!-- PIED DE PAGE -->
    <footer>
      <p>MA WISHLIST · Noël 2026 ♡</p>
    </footer>

  </main>

</body>
</html>
